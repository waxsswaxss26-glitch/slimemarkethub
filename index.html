<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>왁쓰가 만든 슬라임 마켓 링크 모음</title>
<style>
  :root {
    --bg: #fdf6f9;
    --card-bg: #ffffff;
    --accent: #ff8fb1;
    --accent-dark: #e85f8a;
    --text: #4a3b42;
    --muted: #9c8a92;
    --border: #f2dde5;
    --shadow: 0 2px 10px rgba(230, 100, 140, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top-row { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  .lock-btn {
  font-size: 11px;
  color: #d8c7ce;
  background: none;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
  opacity: 0.5;
}
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-top-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar-col {
    display: flex;
    flex-direction: row;
    align-items: center;
    flex-shrink: 0;
    gap: 10px;
    margin-left: 8px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: #ececec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #b3a9ae;
    border: 1px solid #e5dfe1;
  }
  .avatar-name {
    font-size: 14px;
    font-weight: 700;
    text-align: left;
    line-height: 1.3;
    width: 104px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .buttons-row {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .link-btn {
    flex: 0 0 auto;
    width: 118px;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
    font-size: 14px;
    padding: 6px 4px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
    border: 1px solid var(--border);
    color: var(--text);
    background: #fafafa;
  }
  .link-btn.insta { background: #fdeef3; color: var(--accent-dark); border-color: #fbd9e4; }
  .link-btn.mall { background: var(--accent); color: white; border: none; }
  .link-btn.smart { background: #eaf6f3; color: #2f8f76; border-color: #cdeee5; }
  .edit-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    padding: 2px 4px;
  }
  .edit-btn:hover { color: var(--accent-dark); }
  .memo {
    font-size: 12px;
    color: var(--muted);
  }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }

  .ad-slot { margin-bottom: 10px; }
  .ad-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 4px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ad-disclosure {
    text-align: center;
    font-size: 10.5px;
    color: #c2b6bc;
    margin-top: 4px;
  }

  .notice {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 10px 0 20px;
  }

  .fab {
    position: fixed;
    bottom: 24px;
    right: 50%;
    transform: translateX(320px);
    background: var(--accent);
    color: white;
    border: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 26px;
    box-shadow: 0 4px 14px rgba(232,95,138,0.4);
    cursor: pointer;
  }
  @media (max-width: 700px) { .fab { right: 20px; transform: none; } }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 17px; margin: 0 0 16px; }
  .modal p.desc { font-size: 13px; color: var(--muted); margin: -10px 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field input[type="text"], .field input[type="password"], .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  .field textarea { resize: vertical; min-height: 44px; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .checkbox-row input { width: auto; }
  .photo-row { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: #ececec;
    border: 1px solid #e5dfe1;
    flex-shrink: 0;
  }
  .photo-actions { display: flex; flex-direction: column; gap: 6px; }
  .file-btn {
    display: inline-block;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 8px;
    background: #f5f0f2;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    border: 1px solid var(--border);
  }
  .file-btn input { display: none; }
  .remove-photo {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    padding: 0;
  }
  .modal-buttons { display: flex; gap: 8px; margin-top: 18px; }
  .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #f0f0f0; color: var(--text); }
  .btn-save { background: var(--accent); color: white; }
  .btn-delete { background: #fff0f0; color: #d9534f; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }

  @media (max-width: 480px) {
    .avatar { width: 44px; height: 44px; font-size: 16px; }
    .avatar-name { width: 56px; font-size: 12px; }
    .avatar-col { gap: 6px; margin-left: 0; }
    .card-top-row { gap: 8px; }
    .buttons-row { flex-wrap: nowrap; gap: 6px; }
    .link-btn {
      width: auto;
      flex: 1 1 0;
      min-width: 0;
      padding: 6px 2px;
      font-size: 11px;
      white-space: normal;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1> 🫧왁쓰가 만든 슬라임 마켓 링크 모음🔗 </h1>
  <div class="subtitle"> 📢 마켓 순서는 가나다순입니다 </div>
  <div id="allList"></div>
  <div class="notice" id="setupNotice" style="display:none;">
    아직 편집 비밀번호가 설정되지 않았어요.
    <button class="lock-btn" onclick="openSetupModal()" style="margin-left:6px;">비밀번호 설정하기</button>
  </div>
  <div style="text-align:center; margin-top: 40px;">
    <button class="lock-btn" id="lockToggleBtn" onclick="handleLockToggleClick()">🔒</button>
  </div>
</div>

<button class="fab" id="fab" style="display:none;" onclick="openModal()">＋</button>

<div class="modal-overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">마켓 추가</h2>

    <div class="field">
      <label>프로필 사진 (선택)</label>
      <div class="photo-row">
        <img class="photo-preview" id="photoPreview" src="" style="display:none;">
        <div class="photo-preview" id="photoPlaceholder" style="display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#b3a9ae;">?</div>
        <div class="photo-actions">
          <label class="file-btn">사진 선택<input type="file" accept="image/*" id="fPhotoFile" onchange="handlePhotoUpload(event)"></label>
          <button type="button" class="remove-photo" onclick="removePhoto()">사진 제거</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>마켓 이름 (최대 7자)</label>
      <input type="text" id="fName" maxlength="7" placeholder="예: OO슬라임" oninput="updatePlaceholderInitial()">
    </div>
    <div class="field">
      <label>인스타그램 프로필 링크</label>
      <input type="text" id="fInsta" placeholder="https://instagram.com/...">
    </div>
    <div class="field">
      <label>자사몰 링크</label>
      <input type="text" id="fMall" placeholder="https://...">
    </div>
    <div class="field">
      <label class="checkbox-row"><input type="checkbox" id="fHasSmart" onchange="toggleSmartField()"> 스마트스토어도 있어요</label>
    </div>
    <div class="field" id="smartField" style="display:none;">
      <label>스마트스토어 링크</label>
      <input type="text" id="fSmart" placeholder="https://smartstore.naver.com/...">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fMemo" placeholder="예: 매달 15일경 오픈"></textarea>
    </div>

    <div class="modal-buttons">
      <button class="btn btn-delete" id="deleteBtn" style="display:none;" onclick="deleteMarket()">삭제</button>
      <button class="btn btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn btn-save" onclick="saveMarket()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal" style="text-align:center;">
    <h2 style="margin-bottom:10px;">마켓 삭제</h2>
    <p style="font-size:14px; color:var(--muted); margin-bottom:18px;">이 마켓을 삭제할까요?<br>삭제하면 되돌릴 수 없어요.</p>
    <div class="modal-buttons">
      <button class="btn btn-cancel" onclick="closeConfirm()">취소</button>
      <button class="btn btn-delete" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="unlockOverlay">
  <div class="modal">
    <h2>편집 비밀번호 입력</h2>
    <p class="desc">회원님만 아는 비밀번호를 입력하면 편집 모드가 켜져요.</p>
    <div class="field">
      <input type="password" id="unlockInput" placeholder="비밀번호">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-cancel" onclick="closeUnlock()">취소</button>
      <button class="btn btn-save" onclick="tryUnlock()">확인</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="setupOverlay">
  <div class="modal">
    <h2>편집 비밀번호 설정</h2>
    <p class="desc">이 페이지를 공유받은 사람은 보기만 가능하고, 이 비밀번호를 아는 사람만 마켓을 추가/수정/삭제할 수 있어요.</p>
    <div class="field">
      <input type="password" id="setupInput" placeholder="사용할 비밀번호">
    </div>
    <div class="modal-buttons">
      <button class="btn btn-cancel" onclick="closeSetup()">취소</button>
      <button class="btn btn-save" onclick="saveSetup()">설정하기</button>
    </div>
  </div>
</div>

<script>
// ====== 여기에 JSONBin.io에서 발급받은 값을 붙여넣으세요 ======
// ====== JSONBin.io 설정 ======
const JSONBIN_BIN_ID = "6a92f4f3da38895dfe2047e7";
const JSONBIN_API_KEY = "$2a$10$HMHkLVpmgXmYc7nzVDW9mupDg0MIduiz50RDQKy.MJdoAXGchiIa2";
const IMGBB_API_KEY = "ffa78db6cb5e6157565a63cbc728ada4";
// ============================================
// ============================================================

// ====== 쿠팡 파트너스 광고 코드 (최대 3개, 마켓 7개마다 순서대로 반복) ======
const COUPANG_ADS = [
  '<script src="https://ads-partners.coupang.com/g.js"></' + 'script>' +
  '<script>new PartnersCoupang.G({"id":1023965,"template":"carousel","trackingCode":"AF2504602","subId":"waxssslimemarkethub","width":"300","height":"100","tsource":""});</' + 'script>',
  '<script src="https://ads-partners.coupang.com/g.js"></' + 'script>' +
  '<script>new PartnersCoupang.G({"id":1023978,"template":"carousel","trackingCode":"AF2504602","subId":"waxssslimemarkethub","width":"300","height":"100","tsource":""});</' + 'script>',
  '<script src="https://ads-partners.coupang.com/g.js"></' + 'script>' +
  '<script>new PartnersCoupang.G({"id":1023979,"template":"carousel","trackingCode":"AF2504602","subId":"waxssslimemarkethub","width":"300","height":"100","tsource":""});</' + 'script>'
];
// ============================================================

async function fetchBinRecord() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
    headers: { 'X-Master-Key': JSONBIN_API_KEY }
  });
  if (!res.ok) throw new Error('fetch failed: ' + res.status);
  const data = await res.json();
  return data.record || {};
}

let markets = [];
let editingId = null;
let currentPhotoData = null;
let adminCode = null;
let sessionUnlocked = false;

async function init() {
  document.getElementById('allList').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const record = await fetchBinRecord();
    adminCode = record.admin_code || null;
    markets = record.markets || [];
  } catch (e) {
    adminCode = null;
    markets = [];
    showToast('데이터를 불러오지 못했어요. BIN_ID/API_KEY 설정을 확인해주세요.');
  }
  document.getElementById('setupNotice').style.display = adminCode ? 'none' : 'block';
  updateLockUI();
  render();
  migrateOldPhotos();
  
}

async function saveBinRecord(record) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
    body: JSON.stringify(record)
  });
  if (!res.ok) {
    let msg = '';
    try { const err = await res.json(); msg = err.message || ''; } catch (e) {}
    throw new Error(msg || ('save failed: ' + res.status));
  }
  return true;
}

async function persistMarkets() {
  try {
    await saveBinRecord({ markets, admin_code: adminCode });
  } catch (e) {
    showToast('저장 실패: ' + (e.message.includes('1mb') || e.message.includes('size') ? '데이터 용량 초과 (사진을 줄여보세요)' : '다시 시도해주세요'));
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#4a3b42;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:20;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function normalizeUrl(url) {
  if (!url) return '';
  url = url.trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function initialOf(name) {
  return (name || '?').trim().charAt(0) || '?';
}

// --- lock / unlock ---
function updateLockUI() {
  const fab = document.getElementById('fab');
  const lockBtn = document.getElementById('lockToggleBtn');
  fab.style.display = sessionUnlocked ? 'block' : 'none';
 lockBtn.textContent = sessionUnlocked ? '🔓' : '🔒';
  render();
}

function handleLockToggleClick() {
  if (sessionUnlocked) {
    sessionUnlocked = false;
    updateLockUI();
    return;
  }
  if (!adminCode) {
    openSetupModal();
    return;
  }
  openUnlockModal();
}

function openUnlockModal() {
  document.getElementById('unlockInput').value = '';
  document.getElementById('unlockOverlay').classList.add('show');
}
function closeUnlock() {
  document.getElementById('unlockOverlay').classList.remove('show');
}
function tryUnlock() {
  const val = document.getElementById('unlockInput').value;
  if (val && val === adminCode) {
    sessionUnlocked = true;
    closeUnlock();
    updateLockUI();
    showToast('편집 모드가 켜졌어요.');
  } else {
    showToast('비밀번호가 올바르지 않아요.');
  }
}

function openSetupModal() {
  document.getElementById('setupInput').value = '';
  document.getElementById('setupOverlay').classList.add('show');
}
function closeSetup() {
  document.getElementById('setupOverlay').classList.remove('show');
}
async function saveSetup() {
  const val = document.getElementById('setupInput').value.trim();
  if (!val) { showToast('비밀번호를 입력해주세요.'); return; }
  try {
    const ok = await saveBinRecord({ markets, admin_code: val });
    if (!ok) { showToast('설정에 실패했어요. 다시 시도해주세요.'); return; }
    adminCode = val;
    sessionUnlocked = true;
    document.getElementById('setupNotice').style.display = 'none';
    closeSetup();
    updateLockUI();
    showToast('비밀번호가 설정되고 편집 모드가 켜졌어요.');
  } catch (e) {
    showToast('설정에 실패했어요. 다시 시도해주세요.');
  }
}

// --- render ---
function render() {
  const allList = document.getElementById('allList');
  if (markets.length === 0) {
    allList.innerHTML = '<div class="empty">아직 등록된 마켓이 없어요.' + (sessionUnlocked ? ' 오른쪽 아래 ＋ 버튼을 눌러 추가해보세요.' : '') + '</div>';
    return;
  }
  const sorted = [...markets].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  let html = '';
  let adCount = 0;
  sorted.forEach((m, idx) => {
    html += cardHtml(m);
    if ((idx + 1) % 7 === 0) {
      html += adSlotHtml(adCount);
      adCount++;
    }
  });
  allList.innerHTML = html;
  mountCoupangAds();
}

function cardHtml(m) {
  const avatar = m.photoData
    ? `<img class="avatar" src="${m.photoData}">`
    : `<div class="avatar">${escapeHtml(initialOf(m.name))}</div>`;
  const editBtn = sessionUnlocked
    ? `<button class="edit-btn" onclick="openModal('${m.id}')" title="수정">✏️</button>`
    : '';
  return `
    <div class="card">
      ${editBtn}
      <div class="card-top-row">
        <div class="avatar-col">
          ${avatar}
          <div class="avatar-name">${escapeHtml(m.name)}</div>
        </div>
        <div class="buttons-row">
          ${m.instaUrl ? `<a class="link-btn insta" href="${escapeHtml(m.instaUrl)}" target="_blank" rel="noopener">인스타</a>` : ''}
          ${m.mallUrl ? `<a class="link-btn mall" href="${escapeHtml(m.mallUrl)}" target="_blank" rel="noopener">자사몰</a>` : ''}
          ${m.smartUrl ? `<a class="link-btn smart" href="${escapeHtml(m.smartUrl)}" target="_blank" rel="noopener">스마트스토어</a>` : ''}
        </div>
      </div>
      ${m.memo ? `<div class="memo">${escapeHtml(m.memo)}</div>` : ''}
    </div>
  `;
}

function adSlotHtml(adIndex) {
  return `
    <div class="ad-slot">
      <div class="ad-card" data-ad-index="${adIndex}"></div>
      <div class="ad-disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
    </div>
  `;
}

function mountCoupangAds() {
  const validAds = COUPANG_ADS.filter(a => a && a.trim());
  if (validAds.length === 0) return;
  document.querySelectorAll('.ad-card').forEach(el => {
    if (el.dataset.mounted) return;
    el.dataset.mounted = '1';
    const idx = parseInt(el.dataset.adIndex || '0', 10);
    const adHtml = validAds[idx % validAds.length];
    const iframe = document.createElement('iframe');
    iframe.width = '300';
    iframe.height = '100';
    iframe.style.border = 'none';
    iframe.style.display = 'block';
    iframe.scrolling = 'no';
    iframe.srcdoc = '<body style="margin:0;">' + adHtml + '</body>';
    el.appendChild(iframe);
  });
}

// --- photo ---
async function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = async () => {
      const size = 200;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (size - w) / 2;
      const y = (size - h) / 2;
      ctx.drawImage(img, x, y, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

      showToast('사진 업로드 중...');
      try {
        const base64 = dataUrl.split(',')[1];
        const formData = new FormData();
        formData.append('image', base64);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!data.success) throw new Error('upload failed');
        currentPhotoData = data.data.url;
        updatePhotoPreview();
        showToast('사진 업로드 완료!');
      } catch (err) {
        showToast('사진 업로드에 실패했어요. 다시 시도해주세요.');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removePhoto() {
  currentPhotoData = null;
  document.getElementById('fPhotoFile').value = '';
  updatePhotoPreview();
}
function updatePhotoPreview() {
  const img = document.getElementById('photoPreview');
  const placeholder = document.getElementById('photoPlaceholder');
  if (currentPhotoData) {
    img.src = currentPhotoData;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    img.style.display = 'none';
    placeholder.style.display = 'flex';
    updatePlaceholderInitial();
  }
}
function updatePlaceholderInitial() {
  if (currentPhotoData) return;
  const name = document.getElementById('fName').value;
  document.getElementById('photoPlaceholder').textContent = initialOf(name);
}

function toggleSmartField() {
  const has = document.getElementById('fHasSmart').checked;
  document.getElementById('smartField').style.display = has ? 'block' : 'none';
  if (!has) document.getElementById('fSmart').value = '';
}

// --- market modal ---
function openModal(id) {
  if (!sessionUnlocked) return;
  editingId = id || null;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('deleteBtn').style.display = id ? 'block' : 'none';

  if (id) {
    const m = markets.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = '마켓 수정';
    document.getElementById('fName').value = m.name;
    document.getElementById('fInsta').value = m.instaUrl || '';
    document.getElementById('fMall').value = m.mallUrl || '';
    document.getElementById('fSmart').value = m.smartUrl || '';
    document.getElementById('fMemo').value = m.memo || '';
    document.getElementById('fHasSmart').checked = !!m.smartUrl;
    currentPhotoData = m.photoData || null;
    toggleSmartField();
  } else {
    document.getElementById('modalTitle').textContent = '마켓 추가';
    document.getElementById('fName').value = '';
    document.getElementById('fInsta').value = '';
    document.getElementById('fMall').value = '';
    document.getElementById('fSmart').value = '';
    document.getElementById('fMemo').value = '';
    document.getElementById('fHasSmart').checked = false;
    currentPhotoData = null;
    toggleSmartField();
  }
  document.getElementById('fPhotoFile').value = '';
  updatePhotoPreview();
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

async function saveMarket() {
  if (!sessionUnlocked) return;
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('마켓 이름을 입력해주세요.'); return; }
  const instaUrl = normalizeUrl(document.getElementById('fInsta').value);
  const mallUrl = normalizeUrl(document.getElementById('fMall').value);
  const hasSmart = document.getElementById('fHasSmart').checked;
  const smartUrl = hasSmart ? normalizeUrl(document.getElementById('fSmart').value) : '';
  const memo = document.getElementById('fMemo').value.trim();
  const photoData = currentPhotoData || '';

  if (editingId) {
    const m = markets.find(x => x.id === editingId);
    Object.assign(m, { name, instaUrl, mallUrl, smartUrl, memo, photoData });
  } else {
    markets.push({ id: 'm_' + Date.now(), name, instaUrl, mallUrl, smartUrl, memo, photoData });
  }
  await persistMarkets();
  closeModal();
  render();
}

function deleteMarket() {
  if (!sessionUnlocked || !editingId) return;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
}
async function confirmDelete() {
  markets = markets.filter(x => x.id !== editingId);
  await persistMarkets();
  closeConfirm();
  closeModal();
  render();
}

document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });
document.getElementById('confirmOverlay').addEventListener('click', (e) => { if (e.target.id === 'confirmOverlay') closeConfirm(); });
document.getElementById('unlockOverlay').addEventListener('click', (e) => { if (e.target.id === 'unlockOverlay') closeUnlock(); });
document.getElementById('setupOverlay').addEventListener('click', (e) => { if (e.target.id === 'setupOverlay') closeSetup(); });

init();
  async function migrateOldPhotos() {
  let changed = false;
  for (const m of markets) {
    if (m.photoData && m.photoData.startsWith('data:')) {
      try {
        const base64 = m.photoData.split(',')[1];
        const formData = new FormData();
        formData.append('image', base64);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          m.photoData = data.data.url;
          changed = true;
        }
      } catch (e) {
        // 실패한 사진은 건너뛰고 다음으로
      }
    }
  }
  if (changed) {
    await persistMarkets();
    render();
    showToast('예전 사진들을 가벼운 링크로 정리했어요!');
  }
}
